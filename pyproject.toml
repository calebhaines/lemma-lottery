[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemma-lottery"
version = "1.1.0"
description = "A mathematical inspiration tool for AI agents. A little local serendipity."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
theorem = "theorem_catalog.cli:main"

[tool.setuptools.packages.find]
include = ["theorem_catalog*"]

[tool.setuptools.package-data]
theorem_catalog = [
    "data/subjects.json",
    "data/theorems/*.json",
    "data/open_problems.json",
    "data/open_problems/*.json",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
